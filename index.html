<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="description" content="Muhammad Reebal Raza — full-stack developer in Islamabad. Web, mobile, backend, cloud, and AI work, career experience, and education." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Muhammad Reebal Raza | Full-Stack Developer</title>
    <script>
      (function () {
        var theme = 'day'
        try {
          var saved = localStorage.getItem('portfolio-theme')
          theme = saved === 'day' || saved === 'night'
            ? saved
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day')
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'night' ? '#14171d' : '#f6f7f9')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
